<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../brand/brand-tokens.css">
<style>
  /* Print artwork for the six launch products, re-set on Brand Guide v2 (Archivo Expanded Black headline,
     Fraunces italic aside, Plex Mono fine print, the favicon peanut). Rendered to transparent PNG by render.js.
     Sizes are px at 300 dpi. Open designs.html#<id> to see one. */
  html, body { margin: 0; background: transparent; }
  .art { display: none; position: relative; box-sizing: border-box; flex-direction: column; align-items: center; justify-content: center; text-align: center; white-space: nowrap; color: var(--con-navy); }
  .art:target { display: flex; }
  .hl { font-family: var(--con-display); font-stretch: 125%; font-weight: 900; text-transform: uppercase; line-height: .98; letter-spacing: .01em; }
  .as { font-family: var(--con-serif); font-style: italic; font-weight: 500; }
  .fp { font-family: var(--con-mono); font-weight: 600; text-transform: uppercase; letter-spacing: .16em; }
  img { display: block; }

  /* Navy tee, 12 x 8 in */
  #tee-pro-peanut { width: 3600px; height: 2400px; }
  #tee-pro-peanut img { height: 430px; margin-bottom: 120px; }
  #tee-pro-peanut .hl { font-size: 300px; }
  #tee-pro-peanut .l1 { color: var(--con-gold); }
  #tee-pro-peanut .l2 { color: var(--con-cream); margin-top: 30px; }
  #tee-pro-peanut .fp { font-size: 96px; color: var(--con-cream); opacity: .8; margin-top: 130px; }

  /* Natural tee, 12 x 8 in */
  #tee-legume { width: 3600px; height: 2400px; }
  #tee-legume .fp.top { font-size: 110px; color: var(--con-roast); }
  #tee-legume .hl { font-size: 560px; margin-top: 70px; }
  #tee-legume .as { font-size: 300px; color: var(--con-roast); margin-top: 10px; }
  #tee-legume .fp.bot { font-size: 90px; color: var(--con-slate); margin-top: 120px; }

  /* 11 oz mug wrap, 9 x 3.5 in */
  #mug-gallons { width: 2700px; height: 1050px; flex-direction: row; justify-content: space-around; }
  #mug-gallons .side { width: 1150px; display: flex; flex-direction: column; align-items: center; }
  #mug-gallons .hl { font-size: 380px; color: var(--con-roast); }
  #mug-gallons .fp { font-size: 70px; margin-top: 36px; }
  #mug-gallons .as { font-size: 100px; color: var(--con-slate); margin-top: 26px; }
  #mug-gallons .mk { height: 480px; }
  #mug-gallons .wm { width: 1050px; margin-top: 60px; }

  /* 4 in round sticker */
  #sticker-crop { width: 1200px; height: 1200px; border-radius: 50%; background: var(--con-paper); }
  #sticker-crop .disc { position: absolute; inset: 36px; border-radius: 50%; background: var(--con-navy); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #sticker-crop .ring { position: absolute; inset: 70px; border-radius: 50%; border: 10px solid var(--con-gold); }
  #sticker-crop img { height: 330px; }
  #sticker-crop .fp { font-size: 50px; color: var(--con-cream); margin-top: 34px; }
  #sticker-crop .hl { font-size: 190px; color: var(--con-gold); margin-top: 18px; }
  #sticker-crop .as { font-size: 130px; color: var(--con-cream); margin-top: -8px; }

  /* Navy dad cap, flat embroidery in one white thread, 5.3 x 2 in */
  #cap-crop { width: 1590px; height: 600px; }
  #cap-crop img { width: 1500px; }

  #peanut-mark { width: 3000px; height: 3000px; }

  /* Oyster tote, 12 x 12 in */
  #tote-almond { width: 3600px; height: 3600px; }
  #tote-almond .hl { font-size: 250px; line-height: 1.08; }
  #tote-almond .l2 { color: var(--con-red); }
  #tote-almond .fp { font-size: 120px; color: var(--con-slate); margin-top: 200px; }
  #tote-almond img { height: 520px; margin-top: 220px; }
</style></head>
<body>

<div class="art" id="tee-pro-peanut">
  <img src="../brand/logo/svg/mark-full-color.svg" alt="">
  <div class="hl l1">Pro-Peanut.</div><div class="hl l2">Anti-Almond.</div>
  <div class="fp">Cropofnow.com</div>
</div>

<div class="art" id="tee-legume">
  <div class="fp top">Official classification</div>
  <div class="hl">Legume.</div>
  <div class="as">Not a nut.</div>
  <div class="fp bot">Crop of Now · Compliance Dept.</div>
</div>

<div class="art" id="mug-gallons">
  <div class="side"><div class="hl">3.2</div><div class="fp">Gallons per ounce</div><div class="as">(an almond could never)</div></div>
  <div class="side"><img class="mk" src="../brand/logo/svg/mark-full-color.svg" alt=""><img class="wm" src="../brand/logo/svg/wordmark-full-color.svg" alt=""></div>
</div>

<div class="art" id="sticker-crop">
  <div class="disc"><div class="ring"></div>
    <img src="../brand/logo/svg/mark-full-color.svg" alt="">
    <div class="fp">Peanuts are the</div><div class="hl">Crop</div><div class="as">of now</div></div>
</div>

<div class="art" id="cap-crop"><img src="../brand/logo/svg/wordmark-white.svg" alt=""></div>

<div class="art" id="tote-almond">
  <div class="hl">I don't do</div><div class="hl l2">Almond butter.</div>
  <div class="fp">— A peanut person</div>
  <img src="../brand/logo/svg/mark-navy.svg" alt="">
</div>

<div class="art" id="peanut-mark"><img src="../brand/logo/svg/mark-full-color.svg" alt="" style="width:2800px"></div>

</body></html>
