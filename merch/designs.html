<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Libre+Caslon+Text:ital,wght@0,700;1,400;1,700&display=block" rel="stylesheet">
<style>
  /* Print artwork for Crop of Now merch. Rendered to transparent PNG by render.js. Sizes are px at 300 dpi. */
  html, body { margin: 0; background: transparent; }
  .art { white-space: nowrap; display: none; position: relative; box-sizing: border-box; text-align: center; font-family: "Libre Caslon Text", serif; font-weight: 700; }
  .art:target { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .mono { font-family: "IBM Plex Mono", monospace; font-weight: 600; letter-spacing: .18em; }
  .peanut { --c: #D9973F; }

  #tee-pro-peanut { width: 3600px; height: 2400px; gap: 30px; }
  #tee-pro-peanut .l1 { font-size: 355px; line-height: 1; color: #D9973F; }
  #tee-pro-peanut .l2 { font-size: 355px; line-height: 1; color: #F6F0E4; }
  #tee-pro-peanut .l3 { font-size: 120px; color: #EAD7B4; margin-top: 90px; }

  #tee-legume { width: 3600px; height: 2400px; color: #1C2733; }
  #tee-legume .l0 { font-size: 130px; color: #9A5F1C; }
  #tee-legume .l1 { font-size: 640px; line-height: 1.05; }
  #tee-legume .l2 { font-size: 330px; font-style: italic; font-weight: 400; margin-top: -10px; }
  #tee-legume .l3 { font-size: 105px; color: #4A5663; margin-top: 110px; }

  #mug-gallons { width: 2700px; height: 1050px; flex-direction: row !important; justify-content: space-around !important; color: #1C2733; }
  #mug-gallons .side { width: 1100px; display: flex; flex-direction: column; align-items: center; }
  #mug-gallons .big { font-size: 400px; line-height: 1; color: #9A5F1C; }
  #mug-gallons .sub { font-size: 78px; margin-top: 30px; }
  #mug-gallons .it { font-size: 92px; font-style: italic; font-weight: 400; color: #4A5663; margin-top: 30px; }
  #mug-gallons svg { width: 560px; height: 560px; }
  #mug-gallons .brand { font-size: 110px; margin-top: 10px; }

  #sticker-crop { width: 1200px; height: 1200px; border-radius: 50%; background: #FFFBF3; }
  #sticker-crop .disc { position: absolute; inset: 36px; border-radius: 50%; background: #D9973F; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #1C2733; }
  #sticker-crop .ring { position: absolute; inset: 120px; border-radius: 50%; border: 8px dashed #1C2733; }
  #sticker-crop .l1 { font-size: 52px; margin-top: 40px; }
  #sticker-crop .l2 { font-size: 250px; line-height: 1; margin-top: 30px; }
  #sticker-crop .l3 { font-size: 150px; font-style: italic; font-weight: 400; }

  #cap-crop { width: 1590px; height: 600px; color: #F6F0E4; }
  #cap-crop .l1 { font-size: 165px; line-height: 1; letter-spacing: .02em; }

  #tote-almond { width: 3600px; height: 3600px; color: #1C2733; }
  #tote-almond .l1 { font-size: 400px; line-height: 1.1; }
  #tote-almond .l2 { font-size: 400px; line-height: 1.1; color: #A8342A; }
  #tote-almond .l3 { font-size: 140px; color: #4A5663; margin-top: 180px; }

  #peanut-mark { width: 3000px; height: 3000px; }
  #peanut-mark svg { width: 2800px; height: 2800px; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <path id="shell" d="M32 4C41 4 47 10.5 47 19c0 6-4.2 9-4.2 13s5.2 7 5.2 13.5C48 54.5 41 61 32 61s-16-6.5-16-15.5C16 39 21.2 36 21.2 32S17 25 17 19C17 10.5 23 4 32 4Z"/>
    <clipPath id="clip"><use href="#shell"/></clipPath>
    <g id="peanut">
      <g transform="translate(32 32) rotate(-24) scale(1.08) translate(-32 -32.5)">
        <use href="#shell" fill="#B7762B"/>
        <g clip-path="url(#clip)">
          <use href="#shell" fill="#D9973F" transform="translate(-3.5 -1)"/>
          <ellipse cx="24" cy="15" rx="2.8" ry="5.5" fill="#F2C27A" transform="rotate(14 24 15)"/>
          <g fill="#A8661F">
            <circle cx="31" cy="11" r="1.7"/><circle cx="38" cy="16" r="1.7"/><circle cx="30" cy="21" r="1.7"/>
            <circle cx="37" cy="25" r="1.5"/><circle cx="27" cy="40" r="1.7"/><circle cx="34" cy="37" r="1.7"/>
            <circle cx="40" cy="44" r="1.7"/><circle cx="24" cy="49" r="1.7"/><circle cx="32" cy="47" r="1.7"/>
            <circle cx="38" cy="53" r="1.5"/><circle cx="29" cy="55" r="1.7"/>
          </g>
        </g>
      </g>
    </g>
  </defs>
</svg>

<div class="art" id="tee-pro-peanut">
  <div class="l1">PRO-PEANUT.</div><div class="l2">ANTI-ALMOND.</div><div class="l3 mono">CROPOFNOW.COM</div>
</div>

<div class="art" id="tee-legume">
  <div class="l0 mono">OFFICIAL CLASSIFICATION</div><div class="l1">LEGUME.</div><div class="l2">Not a nut.</div>
  <div class="l3 mono">CROP OF NOW · COMPLIANCE DEPT.</div>
</div>

<div class="art" id="mug-gallons">
  <div class="side"><div class="big">3.2</div><div class="sub mono">GALLONS PER OUNCE</div><div class="it">(an almond could never)</div></div>
  <div class="side"><svg viewBox="0 0 64 64"><use href="#peanut"/></svg><div class="brand">Crop of Now</div></div>
</div>

<div class="art" id="sticker-crop">
  <div class="disc"><div class="ring"></div><div class="l1 mono">PEANUTS ARE THE</div><div class="l2">CROP</div><div class="l3">of now</div></div>
</div>

<div class="art" id="cap-crop"><div class="l1">CROP OF NOW</div></div>

<div class="art" id="tote-almond">
  <div class="l1">I DON'T DO</div><div class="l2">ALMOND BUTTER.</div><div class="l3 mono">— A PEANUT PERSON</div>
</div>

<div class="art" id="peanut-mark"><svg viewBox="0 0 64 64"><use href="#peanut"/></svg></div>
</body></html>
